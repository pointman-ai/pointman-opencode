name: Verify and repack official OpenCode
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Download pinned upstream archive and verify checksum
        run: python3 scripts/repack.py --target '${{ matrix.target }}' --download --output release
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: repack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opencode-*
          merge-multiple: true
          path: release
      - name: Attach the repacked builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release may already exist (published at the merge): attach to it
          # rather than failing, whichever came first.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "OpenCode $TAG" --notes "Official OpenCode binaries, checksum-verified and repacked. See the repository README for upstream provenance."
          fi
