name: Verify and repack official OpenCode
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: The tag's release, for the builds to attach to
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release may already exist (published at the merge): the builds attach to it.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "OpenCode $TAG" --notes "Official OpenCode binaries, checksum-verified and repacked. See the repository README for upstream provenance."
  repack:
    # after the release job on a tag; a manual run (no tag, so no release) builds and checks only
    needs: release
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Download pinned upstream archive and verify checksum
        run: python3 scripts/repack.py --target '${{ matrix.target }}' --download --output release
      - name: Attach this build to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" release/* --clobber
